# docker-compose.yml
#
# Brings up the full platform: FastAPI backend + Streamlit UI, sharing a
# persistent volume for the Chroma vector store so the knowledge base
# survives container restarts.
#
# Usage:
#   cp .env.example .env   # fill in GROQ_API_KEY / OLLAMA_BASE_URL / etc.
#   docker compose up --build
#
# API docs:      http://localhost:8000/docs
# Streamlit UI:  http://localhost:8501

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - faiss_data:/app/faiss_index
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma_data:
  faiss_data:
