# ShopAssist :: capstone stack.
#
# `docker compose up -d --build` from inside this repo alone brings up
# `api`, its Postgres DB, and the sentiment/topic classifier. It does NOT
# bundle Ollama - point OLLAMA_API_BASE_URL (default below) at a
# host-installed Ollama (http://host.docker.internal:11434, resolvable
# cross-platform via `api`'s `extra_hosts` entry below), or run the full
# multi-repo platform via shopassist-devops instead, whose own
# docker-compose.yml brings in a real `ollama`/`ollama-bootstrap` pair from
# shopassist-model's compose file. Only shopassist-model is still touched
# here, and only as a build-time source (see `classifier`/
# `classifier-bootstrap` below, which build `../shopassist-model/classifier`
# unmodified) - it's never `docker compose up`'d on its own for this to work.
#
# Deliberately NOT folded in here (by design, run separately):
# - Gemini - a cloud API, not a container; only needs GEMINI_API_KEY set.
# - Ollama - see above; this file expects one already running, not a
#   bundled container.
#
# shopassist-devops's root docker-compose.yml can still `include:` this
# file standalone-project-style and layer its own platform network / real
# Ollama URL on top if you're running the full multi-repo platform instead
# of just this capstone slice - the service key is `api` (not
# `shopassist-api`) to match that override.
#
# Use `docker compose up -d --build`, not plain `up -d`: the image is a
# one-time snapshot of the source tree, so without --build this silently
# keeps running whatever was last built, ignoring newer code entirely.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopassist-api:latest
    container_name: shopassist-api
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_TITLE: AI Agentic Customer Support Platform
      LOG_LEVEL: INFO
      CORS_ALLOWED_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
      # Dummy API-key auth (api/security.py) - blank/false by default so
      # this compose file works standalone with no other setup.
      API_KEY: ${API_KEY:-}
      API_KEY_ENFORCE: ${API_KEY_ENFORCE:-false}
      # 360, not a shorter default - see .env.example's own comment on this
      # var: the shipped fully-local *_PROVIDER config makes several
      # sequential CPU-only LLM calls per sub-task, so 360 keeps headroom.
      CHAT_REQUEST_TIMEOUT_SECONDS: ${CHAT_REQUEST_TIMEOUT_SECONDS:-360}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      # This file doesn't bundle Ollama (see header comment) - defaults to
      # host.docker.internal (resolvable via `extra_hosts` below), i.e. an
      # Ollama installed on your machine. Leave OLLAMA_API_BASE_URL unset in
      # .env for that default; a literal "localhost" there would mean this
      # container itself, not your host machine, and would fail to connect.
      OLLAMA_API_BASE_URL: ${OLLAMA_API_BASE_URL:-http://host.docker.internal:11434}
      # llama3.2:3b - must already be pulled into whichever Ollama
      # OLLAMA_API_BASE_URL points at (`ollama list` to check). Change
      # SHOPASSIST_MODEL to use a different tag.
      OLLAMA_ROUTER_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b}
      OLLAMA_AGENT_REASON_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b}
      OLLAMA_AGENT_INTERPRET_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b}
      OLLAMA_GENERATIVE_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      # Hybrid local/cloud routing (services/llm_inference.py) - each role
      # defaults to "local" (Ollama, above) same as .env.example. These were
      # missing from this list entirely, so setting them in the host .env
      # had no effect on the container until they were added here -
      # docker compose only injects vars that are explicitly referenced in
      # this environment: block, it doesn't forward the whole .env file.
      GENERATIVE_PROVIDER: ${GENERATIVE_PROVIDER:-local}
      ROUTER_PROVIDER: ${ROUTER_PROVIDER:-local}
      AGENT_REASON_PROVIDER: ${AGENT_REASON_PROVIDER:-local}
      AGENT_INTERPRET_PROVIDER: ${AGENT_INTERPRET_PROVIDER:-local}
      # Required only once some *_PROVIDER above is "gemini" - see
      # services/llm_inference.py::_gemini_client(). Blank (not omitted) by
      # default so this compose file still works standalone with no key.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_GENERATIVE_MODEL: ${GEMINI_GENERATIVE_MODEL:-gemini-2.5-flash}
      # common/langfuse_config.py, services/*: LLM call tracing - blank (not
      # omitted) by default so this container still boots with tracing
      # disabled if you haven't set up a Langfuse project. Compose only
      # injects vars explicitly listed here, not your whole .env file - see
      # GENERATIVE_PROVIDER above for the same reasoning.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      # Points at the `postgres` service below by service name (same
      # compose network, not host.docker.internal) - this container always
      # runs against real Postgres, never the SQLite dev DB (that fallback
      # in clients/ecommerce_api_client.py only matters when DATABASE_URL is
      # unset, e.g. running this API on the host outside Docker).
      DATABASE_URL: postgresql://shopassist:shopassist123@postgres:5432/shopassist
      # shopassist-model's encoder-family classifier service (sentiment +
      # zero-shot topic classification, services/classifier_client.py) -
      # `classifier` service below, same compose network, so by service
      # name rather than localhost:8100 (that default is for running this
      # API on the host against shopassist-model's own standalone compose
      # instead - see that repo's README "Connecting shopassist to this
      # service" section). Fails soft if unreachable, same as before.
      CLASSIFIER_API_BASE_URL: http://classifier:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      classifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - shopassist-api-network

  # Postgres for this capstone stack - `api` above already points at it by
  # default. Independent of shopassist-devops's and shopassist-database's
  # own Postgres containers/volumes; not started by either of those compose
  # files, only by this one. Point your host-side .env at this same
  # localhost:5432 to run api outside Docker against it instead.
  #
  # pgvector/pgvector:pg17, not the bare postgres image - Postgres 17 with
  # the pgvector extension pre-built, needed for document_chunks'
  # VECTOR(768) column (db/schema_postgres.sql) - infra-ready for a real
  # vector-search RAG later; services/rag.py's RAGService doesn't read
  # or write it yet, so this is a version/capability upgrade only, no
  # change to today's chat behavior. Official image maintained by the
  # pgvector project, matching shopassist-database's own choice.
  #
  # Major-version bump from the previous postgres:16-alpine - Postgres data
  # directories aren't compatible across major versions, so an existing
  # shopassist-postgres-data volume from before this change needs dropping
  # (`docker compose down -v`, or `docker volume rm` just that one) before
  # `docker compose up` will start cleanly; see db/README.md.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: shopassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopassist
      POSTGRES_PASSWORD: shopassist123
      POSTGRES_DB: shopassist
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shopassist-postgres-data:/var/lib/postgresql/data
      # Official postgres image runs every *.sql file here, in name order,
      # but only against a brand-new (empty) data directory - re-running
      # `docker compose up` against an existing volume does NOT re-apply
      # these. Drop the volume (see db/README.md) to force a reload.
      - ./db/schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed_postgres.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopassist -d shopassist"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - shopassist-api-network

  # --- shopassist-model's encoder-family classifier, folded in so this
  # repo's own `docker compose up` is a complete, single-command,
  # end-to-end stack (same idea as `postgres` above) - build
  # context/config/code copied from shopassist-model/classifier and
  # shopassist-model/config unmodified, see that repo's README's "Encoder
  # models" section for what these two models do and why they're served
  # outside Ollama. ---
  #
  # One-shot job: downloads the encoder models into the shared HF cache
  # volume, then exits. `classifier` below waits for it to finish rather
  # than starting concurrently - a cold download racing the server's own
  # startup would otherwise make its first request wait on an
  # incompletely-cached model.
  classifier-bootstrap:
    build:
      context: ../shopassist-model/classifier
    container_name: shopassist-classifier-bootstrap
    environment:
      CLASSIFIERS_CONFIG: /app/config/classifiers.yaml
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ../shopassist-model/config:/app/config:ro
      - shopassist-classifier-models:/root/.cache/huggingface
    command: ["python", "bootstrap.py"]
    networks:
      - shopassist-api-network
    restart: "no"

  classifier:
    build:
      context: ../shopassist-model/classifier
    container_name: shopassist-classifier
    restart: unless-stopped
    depends_on:
      classifier-bootstrap:
        condition: service_completed_successfully
    environment:
      CLASSIFIERS_CONFIG: /app/config/classifiers.yaml
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ../shopassist-model/config:/app/config:ro
      - shopassist-classifier-models:/root/.cache/huggingface
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${CLASSIFIER_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${CLASSIFIER_MEMORY_LIMIT:-4g}
    networks:
      - shopassist-api-network

networks:
  shopassist-api-network:
    name: shopassist-api-network

volumes:
  shopassist-postgres-data:
  # name (not external) - created fresh on a clean machine, or reused
  # as-is if shopassist-model already populated it, same convention that
  # repo's own docker-compose.yml uses for both volumes below.
  shopassist-classifier-models:
    name: shopassist-classifier-models
