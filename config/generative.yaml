# Model roles the bundled `ollama-bootstrap` service (docker-compose.yml)
# pulls into the bundled `ollama` service on every `docker compose up`.
#
# This is this repo's own copy of shopassist-model/config/generative.yaml's
# format (that project's generative/bootstrap.py is reused unmodified as
# the build context for `ollama-bootstrap` - see docker-compose.yml) but
# with its own tag: llama3.2:3b, not shopassist-model's default
# llama3.2:3b-instruct - 3b is the tag already pulled into the
# shopassist-ollama-models volume shipped with this repo (see README.md's
# "Docker" section), so first-time `docker compose up` needs no fresh
# download. Change it (and OLLAMA_*_MODEL in .env to match) if you'd
# rather pull something else.
#
# Role names below map 1:1 to shopassist's own OLLAMA_*_MODEL env vars:
#   router          -> OLLAMA_ROUTER_MODEL
#   agent_reason    -> OLLAMA_AGENT_REASON_MODEL
#   agent_interpret -> OLLAMA_AGENT_INTERPRET_MODEL
#   generative      -> OLLAMA_GENERATIVE_MODEL
#   embedding       -> OLLAMA_EMBEDDING_MODEL

router: &default_chat_model llama3.2:3b
agent_reason: *default_chat_model
agent_interpret: *default_chat_model
generative: *default_chat_model
embedding: nomic-embed-text
